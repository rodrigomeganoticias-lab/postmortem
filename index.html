<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Mortem — Meganoticias</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap');

  :root {
    --navy:    #0d1f3c;
    --navy2:   #162b52;
    --navy3:   #1e3a6e;
    --red:     #d0021b;
    --red2:    #e8192c;
    --yellow:  #f5c400;
    --yellow2: #ffd633;
    --green:   #1a8f4a;
    --green2:  #21a558;
    --white:   #ffffff;
    --gray1:   #f4f6f9;
    --gray2:   #e8ecf2;
    --gray3:   #c8d0de;
    --gray4:   #8895aa;
    --text:    #1a2640;
    --text2:   #4a5670;
    --sans:    'Barlow', sans-serif;
    --cond:    'Barlow Condensed', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--gray1);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding-bottom: 90px;
  }

  /* ─── HEADER ─── */
  .header {
    background: var(--navy);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(13,31,60,0.25);
  }

  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-block {
    background: var(--red);
    padding: 6px 12px 5px;
    border-radius: 3px;
    line-height: 1;
  }

  .logo-text {
    font-family: var(--cond);
    font-size: 18px;
    font-weight: 800;
    color: var(--white);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .header-title-block {}

  .header-title {
    font-family: var(--cond);
    font-size: 16px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    line-height: 1;
  }

  .header-sub {
    font-size: 11px;
    color: var(--gray3);
    margin-top: 3px;
    letter-spacing: 0.3px;
  }

  .header-counters {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .chip {
    font-family: var(--cond);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 5px 11px;
    border-radius: 4px;
    border: 1.5px solid transparent;
    text-transform: uppercase;
  }

  .chip-ok  { background: rgba(26,143,74,0.15); color: #2ec76b; border-color: rgba(26,143,74,0.35); }
  .chip-err { background: rgba(208,2,27,0.15);  color: #f04455; border-color: rgba(208,2,27,0.35); }
  .chip-no  { background: rgba(245,196,0,0.15); color: #d4a800; border-color: rgba(245,196,0,0.4); }

  /* ─── MAIN ─── */
  .main {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 20px;
  }

  /* ─── META FIELDS ─── */
  .meta-block {
    background: var(--white);
    border: 1px solid var(--gray2);
    border-top: 3px solid var(--navy);
    border-radius: 6px;
    padding: 20px 22px;
    margin-bottom: 22px;
    display: flex;
    gap: 20px;
  }

  .meta-field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .meta-label {
    font-family: var(--cond);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gray4);
  }

  .meta-input {
    background: var(--gray1);
    border: 1.5px solid var(--gray2);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .meta-input:focus { border-color: var(--navy3); background: var(--white); }
  .meta-input::placeholder { color: var(--gray3); font-weight: 400; }

  /* ─── SECTION LABEL ─── */
  .section-label {
    font-family: var(--cond);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray4);
    margin-bottom: 10px;
    padding-left: 2px;
  }

  /* ─── TABLE HEADER ─── */
  .table-header {
    display: grid;
    grid-template-columns: 32px 1fr 110px 110px 110px;
    gap: 0;
    padding: 8px 16px;
    background: var(--navy);
    border-radius: 5px 5px 0 0;
    margin-bottom: 0;
  }

  .th {
    font-family: var(--cond);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gray3);
    text-align: center;
  }

  .th:first-child { text-align: left; color: var(--gray4); }
  .th:nth-child(2) { text-align: left; }

  /* ─── ITEMS ─── */
  .items-wrap {
    border: 1px solid var(--gray2);
    border-top: none;
    border-radius: 0 0 6px 6px;
    overflow: hidden;
    margin-bottom: 22px;
  }

  .item {
    background: var(--white);
    border-bottom: 1px solid var(--gray2);
    transition: background 0.15s;
  }

  .item:last-child { border-bottom: none; }

  .item.status-ok  { background: #f0faf4; }
  .item.status-err { background: #fff5f5; }
  .item.status-no  { background: #fffbea; }

  .item-row {
    display: grid;
    grid-template-columns: 32px 1fr 110px 110px 110px;
    align-items: center;
    gap: 0;
    padding: 11px 16px;
    min-height: 48px;
  }

  .item-num {
    font-family: var(--cond);
    font-size: 11px;
    font-weight: 700;
    color: var(--gray3);
  }

  .item-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.2px;
    padding-right: 12px;
  }

  /* ─── STATUS BUTTONS ─── */
  .btn-s {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--cond);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 6px 8px;
    margin: 0 4px;
    border-radius: 4px;
    border: 1.5px solid var(--gray2);
    background: var(--gray1);
    color: var(--gray4);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .btn-s:hover { border-color: var(--gray3); color: var(--text2); }

  .btn-ok.active  { background: #d4f0e1; color: #15703b; border-color: #6fcc9a; }
  .btn-err.active { background: #fde0e3; color: #b5001a; border-color: #f5919b; }
  .btn-no.active  { background: #fef3c0; color: #926a00; border-color: #f5c400; }

  /* ─── TEXTAREA IN ITEM ─── */
  .item-row-desc {
    grid-template-columns: 32px 1fr !important;
  }

  .item-ta-wrap {
    padding: 0 16px 12px 48px;
  }

  .item-ta {
    width: 100%;
    background: var(--gray1);
    border: 1.5px solid var(--gray2);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
    padding: 9px 11px;
    resize: vertical;
    min-height: 68px;
    outline: none;
    transition: border-color 0.2s;
  }

  .item-ta:focus { border-color: var(--navy3); background: var(--white); }
  .item-ta::placeholder { color: var(--gray3); }

  /* ─── OBS BLOCK ─── */
  .obs-block {
    background: var(--white);
    border: 1px solid var(--gray2);
    border-left: 4px solid var(--navy);
    border-radius: 0 6px 6px 0;
    padding: 18px 20px;
    margin-top: 4px;
  }

  .obs-label {
    font-family: var(--cond);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gray4);
    margin-bottom: 10px;
  }

  .obs-ta {
    width: 100%;
    background: var(--gray1);
    border: 1.5px solid var(--gray2);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.6;
    padding: 10px 12px;
    resize: vertical;
    min-height: 90px;
    outline: none;
    transition: border-color 0.2s;
  }

  .obs-ta:focus { border-color: var(--navy3); background: var(--white); }
  .obs-ta::placeholder { color: var(--gray3); }

  /* ─── GENERATE BUTTON ─── */
  .gen-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(244,246,249,0.97) 35%);
    padding: 20px 24px;
    display: flex;
    justify-content: center;
    gap: 12px;
    z-index: 200;
  }

  .btn-gen {
    font-family: var(--cond);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: var(--navy);
    color: var(--white);
    border: 2px solid transparent;
    border-radius: 5px;
    padding: 13px 44px;
    cursor: pointer;
    transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(13,31,60,0.3);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-gen:hover { background: var(--navy3); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(13,31,60,0.35); }
  .btn-gen:active { transform: translateY(0); }
  .btn-gen-icon { font-size: 17px; }

  .btn-gen-secondary {
    background: var(--white);
    color: var(--navy);
    border-color: var(--navy);
    box-shadow: 0 4px 16px rgba(13,31,60,0.1);
  }
  .btn-gen-secondary:hover { background: var(--gray2); color: var(--navy); }

  /* ─── PDF-ONLY SUMMARY ─── */
  .pdf-summary { display: none; }
  .pdf-ts      { display: none; }

  /* ═══════════════════════════════════════════
     PRINT / PDF STYLES
  ═══════════════════════════════════════════ */
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

    body {
      background: #fff !important;
      color: #1a2640 !important;
      font-family: Arial, Helvetica, sans-serif !important;
      font-size: 10.5pt;
      padding: 0 !important;
    }

    .header {
      position: static !important;
      background: var(--navy) !important;
      box-shadow: none !important;
    }

    .header-inner { padding: 12px 20px !important; }

    .logo-block { background: var(--red) !important; padding: 5px 10px 4px !important; }
    .logo-text  { font-size: 15pt !important; color: #fff !important; }

    .header-title { color: #fff !important; font-size: 13pt !important; }
    .header-sub   { color: #aab !important; font-size: 9pt !important; }

    .chip { font-size: 9pt !important; padding: 4px 9px !important; }
    .chip-ok  { background: rgba(26,143,74,0.15) !important; color: #15803d !important; border-color: #6fcc9a !important; }
    .chip-err { background: rgba(208,2,27,0.1) !important;   color: #b5001a !important; border-color: #f5919b !important; }
    .chip-no  { background: rgba(245,196,0,0.15) !important; color: #92680a !important; border-color: #f5c400 !important; }

    .main { padding: 16px 20px !important; max-width: 100% !important; }

    .meta-block {
      background: #f4f6f9 !important;
      border: 1px solid #dde2ea !important;
      border-top: 3px solid #0d1f3c !important;
      padding: 12px 16px !important;
      margin-bottom: 14px !important;
    }

    .meta-label  { color: #8895aa !important; font-size: 8pt !important; }
    .meta-input  {
      background: #fff !important;
      border: 1px solid #dde2ea !important;
      color: #1a2640 !important;
      font-size: 12pt !important;
      font-weight: 700 !important;
      padding: 6px 10px !important;
    }

    .section-label { color: #8895aa !important; font-size: 8pt !important; margin-bottom: 6px !important; }

    .table-header {
      background: #0d1f3c !important;
      border-radius: 4px 4px 0 0 !important;
      padding: 7px 14px !important;
    }

    .th       { color: #c8d0de !important; font-size: 8pt !important; }
    .th:nth-child(2) { color: #c8d0de !important; }

    .items-wrap {
      border: 1px solid #dde2ea !important;
      border-top: none !important;
      border-radius: 0 0 4px 4px !important;
      margin-bottom: 14px !important;
    }

    .item { background: #fff !important; border-bottom: 1px solid #eaecf2 !important; page-break-inside: avoid; }
    .item.status-ok  { background: #f0faf4 !important; }
    .item.status-err { background: #fff5f5 !important; }
    .item.status-no  { background: #fffbea !important; }

    .item-row  { padding: 9px 14px !important; min-height: 40px !important; }
    .item-num  { color: #c8d0de !important; font-size: 9pt !important; }
    .item-name { color: #1a2640 !important; font-size: 10pt !important; }

    .btn-s {
      font-size: 8pt !important;
      padding: 4px 7px !important;
      margin: 0 3px !important;
      background: #f4f6f9 !important;
      color: #c8d0de !important;
      border-color: #dde2ea !important;
    }

    .btn-ok.active  { background: #d4f0e1 !important; color: #15703b !important; border-color: #6fcc9a !important; }
    .btn-err.active { background: #fde0e3 !important; color: #b5001a !important; border-color: #f5919b !important; }
    .btn-no.active  { background: #fef3c0 !important; color: #926a00 !important; border-color: #f5c400 !important; }

    .item-ta-wrap { padding: 0 14px 10px 46px !important; }
    .item-ta {
      background: #f9fafb !important;
      border: 1px solid #e5e7eb !important;
      color: #333 !important;
      font-size: 9.5pt !important;
      min-height: 0 !important;
      resize: none !important;
      overflow: hidden !important;
    }

    .obs-block {
      background: #f9fafb !important;
      border: 1px solid #dde2ea !important;
      border-left: 4px solid #0d1f3c !important;
      padding: 12px 16px !important;
      page-break-inside: avoid;
    }

    .obs-label { color: #8895aa !important; font-size: 8pt !important; }
    .obs-ta {
      background: #fff !important;
      border: 1px solid #e5e7eb !important;
      color: #333 !important;
      font-size: 9.5pt !important;
      min-height: 0 !important;
      resize: none !important;
      overflow: hidden !important;
    }

    .gen-wrap { display: none !important; }

    /* PDF Summary block */
    .pdf-summary {
      display: block !important;
      background: #0d1f3c !important;
      color: #fff !important;
      border-radius: 5px !important;
      padding: 14px 18px !important;
      margin-top: 16px !important;
      page-break-inside: avoid;
    }

    .pdf-summary-title {
      font-size: 8pt !important;
      letter-spacing: 2px !important;
      text-transform: uppercase !important;
      color: #8895aa !important;
      margin-bottom: 10px !important;
      font-weight: 700 !important;
    }

    .pdf-summary-grid {
      display: flex !important;
      gap: 28px !important;
    }

    .pdf-summary-item { font-size: 9pt !important; }
    .pdf-summary-num  { font-size: 22pt !important; font-weight: 800 !important; display: block !important; line-height: 1 !important; margin-bottom: 2px !important; }
    .pdf-summary-lbl  { color: #8895aa !important; font-size: 8pt !important; }

    .sum-ok-num  { color: #2ec76b !important; }
    .sum-err-num { color: #f04455 !important; }
    .sum-no-num  { color: #f5c400 !important; }
    .sum-pct-num { color: #fff !important; }

    .pdf-ts {
      display: block !important;
      font-size: 7.5pt !important;
      color: #8895aa !important;
      margin-top: 10px !important;
      padding-top: 8px !important;
      border-top: 1px solid #1e3a6e !important;
    }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="header-left">
      <div class="logo-block">
        <div class="logo-text">Meganoticias</div>
      </div>
      <div class="header-title-block">
        <div class="header-title">Post Mortem — Transmisión</div>
        <div class="header-sub">Control de calidad de emisión</div>
      </div>
    </div>
    <div class="header-counters">
      <div class="chip chip-ok"  id="cnt-ok">✓ 0 Sin error</div>
      <div class="chip chip-err" id="cnt-err">✗ 0 Con error</div>
      <div class="chip chip-no"  id="cnt-no">— 0 No entró</div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- META -->
  <div class="meta-block">
    <div class="meta-field">
      <label class="meta-label" for="f-ciudad">Ciudad</label>
      <select class="meta-input" id="f-ciudad">
        <option value="">— Selecciona tu ciudad —</option>
        <option value="NACIONAL">Nacional</option>
        <option value="COLIMA">Colima</option>
        <option value="CULIACAN">Culiacán</option>
        <option value="DURANGO">Durango</option>
        <option value="GUADALAJARA">Guadalajara</option>
        <option value="GUAYMAS">Guaymas</option>
        <option value="HERMOSILLO">Hermosillo</option>
        <option value="IXTAPA_ZIHUATANEJO">Ixtapa Zihuatanejo</option>
        <option value="LA_PAZ">La Paz</option>
        <option value="LEON">León</option>
        <option value="LOS_CABOS">Los Cabos</option>
        <option value="LOS_MOCHIS">Los Mochis</option>
        <option value="MORELIA">Morelia</option>
        <option value="NOGALES">Nogales</option>
        <option value="OBREGON_NAVOJOA">Obregón/Navojoa</option>
        <option value="PUEBLA">Puebla</option>
        <option value="QUERETARO">Querétaro</option>
        <option value="S_LUIS_R_COLORADO">S. Luis R. Colorado</option>
        <option value="SALAMANCA">Salamanca</option>
        <option value="SALINA_CRUZ">Salina Cruz</option>
        <option value="TEHUACAN">Tehuacán</option>
        <option value="TEPIC">Tepic</option>
        <option value="TOLUCA">Toluca</option>
        <option value="LA_LAGUNA">La Laguna</option>
        <option value="TUXPAN">Tuxpan</option>
        <option value="TUXTLA_GUTIERREZ">Tuxtla Gutiérrez</option>
        <option value="VERACRUZ">Veracruz</option>
        <option value="XALAPA">Xalapa</option>
        <option value="ZACATECAS">Zacatecas</option>
        <option value="ZAMORA_LA_PIEDAD">Zamora/La Piedad</option>
      </select>
    </div>
    <div class="meta-field">
      <label class="meta-label">Fecha</label>
      <div class="meta-input" id="f-fecha-display" style="cursor:default;background:var(--gray2);color:var(--text2);font-weight:600;"></div>
      <input type="hidden" id="f-fecha">
    </div>
  </div>

  <div class="section-label">Parámetros de transmisión</div>

  <!-- TABLE HEADER -->
  <div class="table-header">
    <div class="th">#</div>
    <div class="th">Parámetro</div>
    <div class="th">✓ Sin error</div>
    <div class="th">✗ Con error</div>
    <div class="th">— No entró</div>
  </div>

  <!-- ITEMS -->
  <div class="items-wrap" id="items-container"></div>

  <!-- OBSERVACIONES -->
  <div class="obs-block">
    <div class="obs-label">Observaciones generales</div>
    <textarea class="obs-ta" id="obs-general" placeholder="Escribe aquí cualquier observación adicional sobre la transmisión..."></textarea>
  </div>

  <!-- PDF SUMMARY (solo visible al imprimir) -->
  <div class="pdf-summary" id="pdf-summary">
    <div class="pdf-summary-title">Resumen de resultados</div>
    <div class="pdf-summary-grid">
      <div class="pdf-summary-item">
        <span class="pdf-summary-num sum-ok-num"  id="sum-ok">0</span>
        <span class="pdf-summary-lbl">Sin error</span>
      </div>
      <div class="pdf-summary-item">
        <span class="pdf-summary-num sum-err-num" id="sum-err">0</span>
        <span class="pdf-summary-lbl">Con error</span>
      </div>
      <div class="pdf-summary-item">
        <span class="pdf-summary-num sum-no-num"  id="sum-no">0</span>
        <span class="pdf-summary-lbl">No entró</span>
      </div>
      <div class="pdf-summary-item">
        <span class="pdf-summary-num sum-pct-num" id="sum-pct">—</span>
        <span class="pdf-summary-lbl">Tasa de error</span>
      </div>
    </div>
    <div class="pdf-ts" id="pdf-ts"></div>
  </div>

</div>

<!-- GENERATE -->
<!-- TOAST -->
<div id="toast" style="display:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#18a74a;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;padding:12px 28px;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,0.2);z-index:9999;text-align:center;max-width:90%;"></div>

<div class="gen-wrap">
  <button class="btn-gen btn-gen-secondary" onclick="soloEnviar()">
    ↑ Solo enviar
  </button>
  <button class="btn-gen" onclick="generatePDF()">
    <span class="btn-gen-icon">⬇</span> Generar Post Mortem PDF
  </button>
</div>

<script>
const ITEMS = [
  { id:1,  name:"CORTINILLA ABRE",                    input:false },
  { id:2,  name:"TEASER 3 NOTAS + 1",                 input:false },

const state = {};

// Set today's date display (no editable)
(function() {
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm   = String(now.getMonth()+1).padStart(2,'0');
  const dd   = String(now.getDate()).padStart(2,'0');
  const iso  = `${yyyy}-${mm}-${dd}`;
  const months = ['enero','febrero','marzo','abril','mayo','junio',
                  'julio','agosto','septiembre','octubre','noviembre','diciembre'];
  document.getElementById('f-fecha').value = iso;
  document.getElementById('f-fecha-display').textContent =
    `${parseInt(dd)} de ${months[now.getMonth()]} de ${yyyy}`;
})();

function buildItems() {
  const container = document.getElementById('items-container');
  ITEMS.forEach(item => {
    state[item.id] = { status: null, text: '' };

    const div = document.createElement('div');
    div.className = 'item';
    div.id = `item-${item.id}`;

    // Row
    const row = document.createElement('div');
    row.className = item.noButtons ? 'item-row item-row-desc' : 'item-row';
    if (item.noButtons) {
      row.innerHTML = `<span class="item-num">${String(item.id).padStart(2,'0')}</span><span class="item-name">${item.name}</span>`;
    } else {
      row.innerHTML = `<span class="item-num">${String(item.id).padStart(2,'0')}</span><span class="item-name">${item.name}</span><button class="btn-s btn-ok" onclick="setStatus(${item.id},'ok',this)">&#10003; Sin error</button><button class="btn-s btn-err" onclick="setStatus(${item.id},'err',this)">&#10007; Con error</button><button class="btn-s btn-no" onclick="setStatus(${item.id},'no',this)">&#8212; No entr&oacute;</button>`;
    }
    div.appendChild(row);

    if (item.input) {
      const wrap = document.createElement('div');
      wrap.className = 'item-ta-wrap';
      const ta = document.createElement('textarea');
      ta.className = 'item-ta';
      ta.placeholder = item.placeholder || 'Escribe aquí...';
      ta.oninput = e => { state[item.id].text = e.target.value; };
      wrap.appendChild(ta);
      div.appendChild(wrap);
    }

    container.appendChild(div);
  });
}

function setStatus(id, status, btn) {
  state[id].status = status;
  const el = document.getElementById(`item-${id}`);
  el.querySelectorAll('.btn-s').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  el.className = 'item' + (status === 'ok' ? ' status-ok' : status === 'err' ? ' status-err' : ' status-no');
  updateCounters();
}

function updateCounters() {
  let ok = 0, err = 0, no = 0;
  ITEMS.forEach(i => {
    if (state[i.id].status === 'ok')  ok++;
    if (state[i.id].status === 'err') err++;
    if (state[i.id].status === 'no')  no++;
  });
  document.getElementById('cnt-ok').textContent  = `✓ ${ok} Sin error`;
  document.getElementById('cnt-err').textContent = `✗ ${err} Con error`;
  document.getElementById('cnt-no').textContent  = `— ${no} No entró`;
  return { ok, err, no };
}

function formatDate(dateStr) {
  // dateStr = YYYY-MM-DD  →  convert for filename
  if (!dateStr) return '';
  return dateStr.replace(/-/g, '');  // 20250430
}

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3nOh1dI87ZqQAb_YoUqtaCKdodn1_k3sP8XfuFPvfCTcsfdpJPoZWrRU5i6JbHdw/exec';

async function sendToSheet(payload) {
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    return true;
  } catch(e) {
    return false;
  }
}

function showToast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 4000);
}

async function generatePDF() {
  const ciudad = document.getElementById('f-ciudad').value.trim();
  const fecha  = document.getElementById('f-fecha').value;

  if (!ciudad) {
    showToast('⚠ Escribe el nombre de la ciudad antes de generar', '#d0021b');
    return;
  }
  if (!fecha) {
    showToast('⚠ Selecciona la fecha antes de generar', '#d0021b');
    return;
  }

  const { ok, err, no } = updateCounters();
  const total = ok + err + no;
  const pct = total > 0 ? Math.round((err / total) * 100) + '%' : '—';

  // Update summary block
  document.getElementById('sum-ok').textContent  = ok;
  document.getElementById('sum-err').textContent = err;
  document.getElementById('sum-no').textContent  = no;
  document.getElementById('sum-pct').textContent = pct;

  // Timestamp
  const now = new Date();
  const hora = now.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
  const ts = now.toLocaleString('es-MX', {
    weekday:'long', year:'numeric', month:'long',
    day:'numeric', hour:'2-digit', minute:'2-digit'
  });
  document.getElementById('pdf-ts').textContent = `Generado: ${ts}`;

  // Build payload con todos los reactivos
  const ciudadClean = ciudad.toUpperCase().replace(/\s+/g,'_').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const payload = {
    ciudad: ciudadClean,
    fecha,
    hora,
    sin_error: ok,
    errores: err,
    no_entro: no,
    observaciones: document.getElementById('obs-general').value.trim(),
    pdf_url: ''
  };

  // Estado de cada reactivo — inputs de texto mandan el texto, no el status
  const TEXT_ITEMS = [13, 17, 18, 21];
  ITEMS.forEach(item => {
    const key = `p${String(item.id).padStart(2,'0')}`;
    if (TEXT_ITEMS.includes(item.id)) {
      // Para items con textarea, mandar el texto escrito
      const ta = document.querySelector(`#item-${item.id} .item-ta`);
      payload[key] = ta ? ta.value.trim() : '';
    } else {
      const s = state[item.id].status;
      payload[key] = s === 'ok' ? 'ok' : s === 'err' ? 'error' : s === 'no' ? 'no' : '';
    }
  });

  // Enviar al Sheet en segundo plano
  showToast('⏳ Enviando reporte...', '#1e3a6e');
  sendToSheet(payload).then(ok => {
    showToast(ok ? '✓ Reporte enviado correctamente al sistema' : '⚠ Sin conexión — el PDF se generó pero no se envió', ok ? '#18a74a' : '#f5c400');
  });

  // Filename para PDF
  const fechaClean = formatDate(fecha);
  document.title = `${ciudadClean}_${fechaClean}_PM`;

  // Auto-resize textareas
  document.querySelectorAll('textarea').forEach(ta => {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  });

  setTimeout(() => {
    window.print();
    document.title = 'Post Mortem — Meganoticias';
  }, 120);
}

async function soloEnviar() {
  const ciudad = document.getElementById('f-ciudad').value.trim();
  const fecha  = document.getElementById('f-fecha').value;

  if (!ciudad) { showToast('⚠ Selecciona tu ciudad antes de enviar', '#d0021b'); return; }
  if (!fecha)  { showToast('⚠ Selecciona la fecha antes de enviar', '#d0021b'); return; }

  const { ok, err, no } = updateCounters();
  const now  = new Date();
  const hora = now.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
  const ciudadClean = ciudad.toUpperCase().replace(/\s+/g,'_').normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  const payload = {
    ciudad: ciudadClean, fecha, hora,
    sin_error: ok, errores: err, no_entro: no,
    observaciones: document.getElementById('obs-general').value.trim(),
    pdf_url: ''
  };

  const TEXT_ITEMS = [13, 17, 18, 21];
  ITEMS.forEach(item => {
    const key = `p${String(item.id).padStart(2,'0')}`;
    if (TEXT_ITEMS.includes(item.id)) {
      const ta = document.querySelector(`#item-${item.id} .item-ta`);
      payload[key] = ta ? ta.value.trim() : '';
    } else {
      const s = state[item.id].status;
      payload[key] = s === 'ok' ? 'ok' : s === 'err' ? 'error' : s === 'no' ? 'no' : '';
    }
  });

  showToast('⏳ Enviando reporte...', '#1e3a6e');
  const result = await sendToSheet(payload);
  showToast(result ? '✓ Reporte enviado correctamente al sistema' : '⚠ Sin conexión — intenta de nuevo', result ? '#18a74a' : '#d0021b');
}
